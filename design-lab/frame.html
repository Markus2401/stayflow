<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design frame</title>
<style>
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.lab-skel{display:grid}.lab-skel i{display:block;height:56px;border-bottom:1px solid rgb(0 0 0 / .06);background:linear-gradient(90deg,transparent,rgb(0 0 0 / .045),transparent) 0 0 / 200% 100%;animation:labshimmer 1.4s linear infinite}
@keyframes labshimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.lab-skel i{animation:none}}
</style></head>
<body style="margin:0"><div id="app"></div>
<script type="module">
const d = new URLSearchParams(location.search).get('design') || 'ledger';
try {
  const [{ default: design }, { boot }] = await Promise.all([import('./designs/' + d + '.js'), import('./core.js')]);
  await boot(design);
} catch (e) { document.body.textContent = 'Could not start design: ' + e.message; console.error(e); }
</script></body></html>
